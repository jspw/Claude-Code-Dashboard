name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npm run lint:commit-msg -- --message "$PR_TITLE" --source "pull request title"

      - name: Validate PR commit messages
        if: github.event_name == 'pull_request'
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: npm run lint:commits -- "$COMMIT_RANGE"

      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            COMMIT_RANGE="$BEFORE_SHA..$AFTER_SHA"
          else
            COMMIT_RANGE="$AFTER_SHA"
          fi
          npm run lint:commits -- "$COMMIT_RANGE"

      - name: Install root deps
        run: npm ci

      - name: Install webview-ui deps
        run: npm ci
        working-directory: webview-ui

      - name: Verify project
        run: npm run verify
